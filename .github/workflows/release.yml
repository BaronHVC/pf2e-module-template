name: Release

# Se dispara solo cuando publicas una etiqueta tipo v0.2.0 (estable) o
# v0.2.0-rc.1 (prerelease). En mode public las dos actualizan tambien el canal
# de pruebas dev; en mode protected (modulo de pago) nunca, y una prerelease
# no se sube a Foundry.
on:
  push:
    tags:
      - "v*"

# Necesario para que el workflow reutilizable pueda crear el release: un
# workflow llamado solo puede tener los permisos que le da quien lo llama.
permissions:
  contents: write

jobs:
  release:
    # La plantilla misma nunca publica: solo los repos creados a partir de ella.
    if: github.repository != 'BaronHVC/pf2e-module-template'
    # El pin es el commit de baron-core.lock.json. No se edita a mano: sync-core
    # lo reescribe, y check-module falla si no coincide con el lock.
    uses: BaronHVC/pf2e-baron-core/.github/workflows/module-release.yml@6c43cef05c9cb682d959bd5fe9c2145848568cbf
